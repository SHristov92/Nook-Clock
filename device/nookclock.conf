# nookclock configuration - key = value, '#' starts a comment.

# Location for the forecast (decimal degrees) and the label shown top-left.
lat = 42.70
lon = 23.32
place = Sofia

# metric (C, km/h) or imperial (F, mph)
units = metric

# 1 = 24-hour clock, 0 = 12-hour with AM/PM
clock24 = 1

# Screen orientation in degrees: 0 = portrait (as the Nook is normally held),
# 90 / 270 = landscape (buttons on the left / right), 180 = upside down.
rotate = 90

# Minutes between weather downloads (Open-Meteo, no API key needed).
weather_every = 15

# Minutes between flashing full refreshes that clear e-ink ghosting.
# Every other minute uses a quick non-flashing update.
full_every = 30

# Set the system clock from the weather server's HTTP Date header when it
# drifts more than 30 s (the Nook has no NTP once the B&N UI is stopped).
sync_time = 1

# UTC offset in minutes, used only until the first weather download
# (afterwards the offset - including DST - comes from Open-Meteo).
utc_offset = 180

# DNS servers to try first (comma separated). Empty = use DHCP's, then
# 8.8.8.8 and 1.1.1.1.
dns =

# Framebuffer device and the sysfs node that triggers a full e-ink refresh.
fbdev = /dev/graphics/fb0
epd_refresh = /sys/class/graphics/fb0/epd_refresh
